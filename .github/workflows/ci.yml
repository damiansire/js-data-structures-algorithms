name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Typecheck como gate propio y bloqueante, separado de lint y de build
      # (corpus node-ts/from-consensus-2026-07-16.md, consenso 2: n8n y Backstage
      # corren `tsc --noEmit` en un step dedicado). Antes existia el script pero
      # ningun workflow lo corria: una regresion de tipos pasaba en verde.
      - name: Typecheck
        run: npm run build

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:metrics

      - name: Check README metrics are up to date
        if: matrix.node-version == '22.x'
        run: npm run check-metrics

      # "Working tree limpio" como check determinista (corpus node-ts, consenso 4:
      # Backstage cierra sus jobs con `git ls-files --others --modified`). Convierte
      # "los scripts no ensucian archivos versionados" de suposicion en propiedad
      # verificada: test:metrics genera archivos y update-metrics reescribe el README.
      - name: Working tree limpio tras los gates
        shell: bash
        run: |
          set -e
          DIRTY=$(git ls-files --others --exclude-standard --modified)
          if [ -n "$DIRTY" ]; then
            echo "Los gates dejaron archivos versionados modificados o sin ignorar:"
            echo "$DIRTY"
            git diff --stat
            exit 1
          fi
          echo "OK: working tree limpio."
